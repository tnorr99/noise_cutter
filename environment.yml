name: noise_cutter
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8 # Adjust based on your specific GPU/CUDA version
  - opencv
  - numpy
  - scipy
  - pillow
  - pip
  - pip:
      - imagehash==4.3.1
      - PyWavelets==1.4.1 # Required by imagehash